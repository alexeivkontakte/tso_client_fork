name: Build Windows release

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: nuget restore ${{ env.SOLUTION_FILE_PATH }}

    - name: Prepare TSO Client Fork build
      shell: pwsh
      run: |
        Copy-Item -LiteralPath "client_upstream.swf" -Destination "client/files/content/client.swf" -Force

        $sourcePath = "client/Main.xaml.cs"
        $source = [System.IO.File]::ReadAllText($sourcePath)
        $source = $source.Replace(
          "https://raw.githubusercontent.com/fedorovvl/tso_client/master/",
          "https://raw.githubusercontent.com/${{ github.repository }}/master/"
        )
        $source = $source.Replace(
          "https://api.github.com/repos/fedorovvl/tso_client/contents/",
          "https://api.github.com/repos/${{ github.repository }}/contents/"
        )
        $shortSha = $env:GITHUB_SHA.Substring(0, 7)
        $source = $source.Replace("#TESTTAG#", $shortSha)
        [System.IO.File]::WriteAllText(
          $sourcePath,
          $source,
          [System.Text.UTF8Encoding]::new($true)
        )

        if ($source.Contains("fedorovvl/tso_client")) {
          throw "The build still contains an upstream update URL."
        }

    - name: Build Windows client
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} /property:Platform=x86 ${{ env.SOLUTION_FILE_PATH }}

    - name: Validate executable
      shell: pwsh
      run: |
        $exe = "client/bin/Release/client.exe"
        if (-not (Test-Path -LiteralPath $exe)) {
          throw "client.exe was not produced."
        }
        if ((Get-Item -LiteralPath $exe).Length -lt 20000000) {
          throw "client.exe is unexpectedly small; embedded portable content may be missing."
        }

    - uses: actions/upload-artifact@v4
      with:
        name: TSO-Client-Fork-Windows
        path: client/bin/Release/client.exe

    - name: Publish tagged Windows release
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        $tag = $env:GITHUB_REF_NAME
        $asset = "client.exe"
        Copy-Item -LiteralPath "client/bin/Release/client.exe" -Destination $asset -Force

        $notes = @"
        One-file Windows build of TSO Client Fork.

        Download client.exe and start it normally. No --skip argument or manual SWF replacement is required.
        "@

        gh release view $tag *> $null
        if ($LASTEXITCODE -eq 0) {
          gh release upload $tag $asset --clobber
        }
        elseif ($tag -match "(?i)(alpha|beta|rc)") {
          gh release create $tag $asset --title "TSO Client Fork $tag" --notes $notes --prerelease
        }
        else {
          gh release create $tag $asset --title "TSO Client Fork $tag" --notes $notes
        }
